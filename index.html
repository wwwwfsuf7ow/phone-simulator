<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>捡手机模拟器</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.phone{width:min(390px,100vw);height:min(844px,100dvh);position:relative;overflow:hidden;background:linear-gradient(145deg,#425c92,#b87ca9 55%,#edb38f);border:7px solid #181818;border-radius:42px;box-shadow:0 20px 70px #0008}.status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 27px;font-weight:650;font-size:15px}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:105px;height:28px;border-radius:20px;background:#111}.clock{text-align:center;margin-top:70px;font-size:72px;font-weight:250;letter-spacing:-3px}.date{text-align:center;font-size:18px}.hint{text-align:center;margin-top:18px;font-size:13px;opacity:.8}.apps{position:absolute;left:20px;right:20px;bottom:108px;display:grid;grid-template-columns:repeat(4,1fr);gap:23px 10px}.app{text-align:center;font-size:12px;cursor:pointer}.app span{display:grid;place-items:center;width:57px;height:57px;margin:auto auto 7px;background:#ffffffd9;border-radius:15px;font-size:29px;color:#202838}.dock{position:absolute;bottom:20px;left:16px;right:16px;background:#ffffff45;border-radius:24px;padding:12px;display:flex;justify-content:space-around}.dock .app span{margin:0}.homebar{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:125px;height:5px;background:white;border-radius:9px}.screen{position:absolute;inset:0;background:#f6f6f9;color:#161616;display:none;padding-top:52px}.screen.active{display:block}.head{display:flex;align-items:center;gap:15px;padding:15px 20px;border-bottom:1px solid #ddd;font-weight:650;font-size:20px}.back{border:0;background:none;color:#1677ff;font-size:18px;cursor:pointer}.content{padding:18px;overflow:auto;height:calc(100% - 150px)}.thread{padding:15px;background:white;border-radius:15px;margin-bottom:10px;cursor:pointer}.thread small{display:block;color:#777;margin-top:6px}.bubble{background:#d9f7c5;padding:12px;border-radius:15px;margin:12px 0 12px auto;max-width:80%;width:max-content}.bubble.other{background:#fff;margin-left:0;margin-right:auto}.composer{position:absolute;bottom:22px;left:12px;right:12px;display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid #ddd;border-radius:20px;padding:12px}.composer button,.primary{border:0;border-radius:20px;background:#2ca76a;color:white;padding:10px 16px}.note{width:100%;height:60%;border:0;padding:15px;font:16px/1.7 inherit;resize:none;border-radius:12px}.settings{font-size:14px;color:#666;margin:12px 0}.screen .homebar{background:#333;cursor:pointer}
.incoming{position:absolute;inset:0;z-index:20;background:linear-gradient(165deg,#253b36,#111c20 70%,#07100e);color:#fff;display:none;flex-direction:column;align-items:center;padding:100px 20px 65px;text-align:center}.incoming.visible{display:flex}.call-avatar{width:112px;height:112px;border-radius:30px;background:linear-gradient(135deg,#7ea59a,#425e58);display:grid;place-items:center;font-size:52px;margin:35px auto 25px}.call-name{font-size:36px;font-weight:600}.call-type{font-size:16px;color:#c8d7d0;margin-top:12px}.call-actions{margin-top:auto;width:100%;display:flex;justify-content:space-around}.call-action{border:0;background:none;color:white;font-size:15px;display:flex;align-items:center;flex-direction:column;gap:13px}.call-action span{width:75px;height:75px;border-radius:50%;display:grid;place-items:center;font-size:32px}.decline span{background:#ee4b4b}.accept span{background:#26c76a}.call-status{margin-top:30px;color:#d1dfd7}.call-end{margin-top:auto;border:0;background:#ee4b4b;color:#fff;border-radius:40px;padding:16px 42px;font-size:18px}.screen.wechat{background:#ededed;padding-top:44px}.wechat .head{height:56px;padding:0 16px;border-bottom:1px solid #e5e5e5;justify-content:space-between;font-size:17px;font-weight:600}.wechat .back{font-size:34px;font-weight:300;color:#191919;line-height:1;padding:0}.wechat .head::after{content:'•••';font-size:19px;letter-spacing:2px;font-weight:600}.wechat .content{height:calc(100% - 175px);padding:15px 12px 20px}.wechat .bubble{font-size:16px;line-height:1.5;background:#95ec69;border-radius:5px;padding:9px 12px;margin:0;max-width:calc(100% - 110px);width:fit-content;overflow-wrap:anywhere;position:relative}.wechat .bubble.other{background:#fff}.wechat .msg-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0}.wechat .msg-row.mine{justify-content:flex-end}.wechat .msg-avatar{width:42px;height:42px;border-radius:5px;background:#7f9fa5;color:white;display:grid;place-items:center;font-size:16px;flex-shrink:0}.wechat .msg-row.other .msg-avatar{background:#b15a75}.wechat .msg-row.mine .bubble::after{content:'';position:absolute;right:-6px;top:12px;border-left:7px solid #95ec69;border-top:6px solid transparent;border-bottom:6px solid transparent}.wechat .msg-row.other .bubble::before{content:'';position:absolute;left:-6px;top:12px;border-right:7px solid white;border-top:6px solid transparent;border-bottom:6px solid transparent}.wechat .chat-time{text-align:center;color:#a2a2a2;font-size:13px;margin:12px 0 20px}.wechat .composer{bottom:18px;left:0;right:0;background:#f7f7f7;border-top:1px solid #e2e2e2;padding:9px 10px 14px;align-items:center;gap:10px}.wechat .composer input{border:0;border-radius:5px;background:white;height:40px;padding:7px 9px;font-size:16px}.wechat .composer button{border-radius:5px;padding:10px 12px}.wechat .composer .tool-icon{font-size:25px;line-height:1;color:#202020}.wechat .homebar{background:#777}.wechat .thread{background:transparent;border-radius:0;border-bottom:1px solid #ddd;padding:15px 6px;font-size:17px}.wechat .thread small{padding-left:35px;font-size:13px}.wechat .content:has(.thread){padding:0 16px;background:#fff}</style></head><body><main class="phone"><div class="island"></div><div class="status"><span id="time">9:41</span><span>●●● ▰</span></div><div class="date" id="date"></div><div class="clock" id="bigtime">9:41</div><div class="hint">点击图标探索这部手机</div><div class="apps" id="apps"></div><div class="dock" id="dock"></div><section class="screen" id="screen"><div class="head"><button class="back" onclick="home()">‹ 返回</button><span id="title"></span></div><div class="content" id="content"></div><div id="composer"></div><div class="homebar" onclick="home()"></div></section><section class="incoming" id="incoming" aria-label="微信来电"><div class="call-avatar">文</div><div class="call-name">耀文</div><div class="call-type" id="callType">微信语音通话邀请</div><div class="call-actions" id="callActions"><button class="call-action decline" id="decline"><span>✕</span>拒绝</button><button class="call-action accept" id="accept"><span>☎</span>接听</button></div><div id="callConnected" style="display:none;flex-direction:column;align-items:center;margin-top:auto"><div class="call-status" id="callTimer">00:00</div><button class="call-end" id="hangup">挂断</button></div></section><div class="homebar"></div></main><script>
const definitions=[['微信','💬'],['备忘录','📝'],['相册','🌄'],['设置','⚙️'],['短信','✉️'],['电话','📞'],['日历','📅'],['关于','📱']];const dock=['微信','短信','电话','备忘录'];let activeChat='';const initialChats=[{name:'神秘联系人',messages:[{who:'other',text:'你终于找到这部手机了。'},{who:'other',text:'想知道它的主人是谁吗？先看看备忘录。'}]},{name:'小雨',messages:[{who:'other',text:'明天还在老地方见吗？'}]}];let chats=JSON.parse(localStorage.getItem('phone-chats')||'null')||initialChats;let note=localStorage.getItem('phone-note')||'10月23日\n\n如果有人捡到了我的手机，请帮我找到它的主人。\n\n线索一：有人在等一条消息。';const $=id=>document.getElementById(id);function save(){localStorage.setItem('phone-chats',JSON.stringify(chats))}function icon(item){const d=definitions.find(x=>x[0]===item);return '<div class="app" data-app="'+item+'"><span>'+d[1]+'</span>'+item+'</div>'}$('apps').innerHTML=definitions.map(x=>icon(x[0])).join('');$('dock').innerHTML=dock.map(icon).join('');document.querySelectorAll('[data-app]').forEach(e=>e.onclick=()=>openApp(e.dataset.app));function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){$('screen').classList.remove('active');$('screen').classList.remove('wechat');$('composer').innerHTML='';activeChat=''}function openApp(name){$('screen').classList.toggle('wechat',name==='微信');$('screen').classList.add('active');$('title').textContent=name;$('composer').innerHTML='';const c=$('content');if(name==='微信'||name==='短信'){c.innerHTML=chats.map((x,i)=>'<div class="thread" data-chat="'+i+'">💬　'+esc(x.name)+'<small>'+esc(x.messages.at(-1)?.text||'')+'</small></div>').join('');c.querySelectorAll('[data-chat]').forEach(e=>e.onclick=()=>showChat(+e.dataset.chat))}else if(name==='备忘录'){c.innerHTML='<textarea class="note" id="note" aria-label="备忘录"></textarea><p class="settings">内容自动保存在本机浏览器</p>';$('note').value=note;$('note').oninput=e=>{note=e.target.value;localStorage.setItem('phone-note',note)}}else if(name==='设置'){c.innerHTML='<h3>模拟手机设置</h3><p>这是一个网页互动故事原型。</p><button class="primary" id="reset">重置故事数据</button>';$('reset').onclick=()=>{if(confirm('确定重置聊天和备忘录吗？')){localStorage.clear();location.reload()}}}else if(name==='关于'){c.innerHTML='<h3>捡手机 · 互动故事</h3><p>你偶然捡到一部手机。翻看消息与备忘录，慢慢拼凑主人的故事。</p><p>后续可添加人物、聊天分支、朋友圈、照片、密码锁和多结局。</p>'}else if(name==='电话'){c.innerHTML='<h3>最近通话</h3><div class="thread">未知号码　　昨天 21:08</div>'}else if(name==='相册'){c.innerHTML='<h3>相簿</h3><p>这里还没有照片。</p>'}else if(name==='日历'){c.innerHTML='<h3>日历</h3><p>重要约定：明天 · 老地方</p>'}}function showChat(i){$('screen').classList.add('wechat');activeChat=i;const chat=chats[i];$('title').textContent=chat.name;function render(){$('content').innerHTML='<div class="chat-time">15:06</div>'+chat.messages.map(m=>'<div class="msg-row '+(m.who==='other'?'other':'mine')+'">'+(m.who==='other'?'<div class="msg-avatar">'+esc(chat.name.slice(0,1))+'</div>':'')+'<div class="bubble '+(m.who==='other'?'other':'')+'">'+esc(m.text)+'</div>'+(m.who!=='other'?'<div class="msg-avatar">我</div>':'')+'</div>').join('');$('content').scrollTop=$('content').scrollHeight}render();$('composer').innerHTML='<form class="composer" id="form"><span class="tool-icon" aria-hidden="true">◉</span><input id="msg" placeholder="发送消息" autocomplete="off" aria-label="消息"><span class="tool-icon" aria-hidden="true">☺</span><button>发送</button></form>';$('form').onsubmit=e=>{e.preventDefault();const v=$('msg').value.trim();if(!v)return;chat.messages.push({who:'me',text:v});save();$('msg').value='';render()}}function tick(){const d=new Date();const t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('time').textContent=t;$('bigtime').textContent=t;$('date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,30000);
let callInterval=null;function endCall(){document.getElementById('incoming').classList.remove('visible');if(callInterval)clearInterval(callInterval);callInterval=null}document.getElementById('decline').onclick=endCall;document.getElementById('hangup').onclick=endCall;document.getElementById('accept').onclick=()=>{document.getElementById('callActions').style.display='none';document.getElementById('callConnected').style.display='flex';document.getElementById('callType').textContent='微信语音通话';let sec=0;callInterval=setInterval(()=>{sec++;document.getElementById('callTimer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)};setTimeout(()=>document.getElementById('incoming').classList.add('visible'),800);</script></body></html>
