.add('active');$('back').onclick=home;$('title').textContent=name;$('more').style.display=name==='微信'?'block':'none';$('footer').innerHTML='';if(name==='微信')showList();else if(name==='备忘录'){$('content').innerHTML='<div class="panel"><textarea id="note" class="note"></textarea></div>';$('note').value=note;$('note').oninput=e=>{note=e.target.value;localStorage.setItem('phone-note',note)}}else if(name==='设置'){$('content').innerHTML='<div class="panel"><h3>模拟手机设置</h3><button class="editor-launch" id="launch-editor">✎ 管理人物、群聊与聊天剧情 →</button><p style="font-size:13px;color:#777">作者编辑仅保存在当前浏览器，不会直接改变所有玩家的内容。</p><button id="reset">重置聊天与备忘录</button></div>';$('launch-editor').onclick=openManager;$('reset').onclick=()=>{if(confirm('确定重置吗？')){localStorage.clear();location.reload()}}}else{$('content').innerHTML='<div class="panel">'+(name==='相册'?'相簿暂无照片':name==='电话'?'最近通话：耀文':name==='日历'?'明天 · 老地方':'暂无消息')+'</div>'}}function showList(){$('content').className='scroll';$('title').textContent='微信';$('back').style.display='none';$('more').textContent='⊕';$('content').innerHTML='<div class="search">⌕　搜索</div><div class="threads">'+chats.map((c,i)=>'<div class="thread" data-index="'+i+'"><div class="avatar">'+(c.name==='耀文'?avatarPhoto:esc(c.name.slice(0,1)))+'</div><div class="thread-main"><div class="thread-name">'+esc(c.name)+'</div><div class="preview">'+esc(c.messages.at(-1)?.text||'')+'</div></div><span class="thread-time">18:30</span></div>').join('')+'</div>';$('content').querySelectorAll('[data-index]').forEach(el=>el.onclick=()=>showChat(+el.dataset.index));$('footer').innerHTML='<nav class="tabs"><button class="tab selected">◉<small>微信</small></button><button class="tab" data-tab="通讯录">♙<small>通讯录</small></button><button class="tab" data-tab="发现">◎<small>发现</small></button><button class="tab" data-tab="我">◯<small>我</small></button></nav>';$('footer').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{$('title').textContent=b.dataset.tab;$('content').innerHTML='<div class="panel">'+(b.dataset.tab==='通讯录'?chats.map((c,i)=>'<div class="thread" data-index="'+i+'">'+esc(c.name)+'</div>').join(''):'暂无内容')+'</div>';$('content').querySelectorAll('[data-index]').forEach(e=>e.onclick=()=>showChat(+e.dataset.index))})}function showChat(i){currentChat=i;const c=chats[i];$('back').style.display='block';$('back').onclick=showList;$('more').textContent='•••';$('title').textContent=c.name;function render(){$('content').className='scroll chat-scroll';$('content').innerHTML='<div class="chat-time">15:06</div>'+c.messages.map(m=>'<div class="chat-row '+(m.who==='me'?'mine':'other')+'">'+(m.who!=='me'?'<div class="avatar">'+(c.name==='耀文'&&c.type!=='group'?avatarPhoto:esc((m.who.startsWith('member:')?m.who.slice(7):c.name)[0]||'群'))+'</div>':'')+'<div class="bubble">'+(c.type==='group'&&m.who!=='me'?'<div class="group-sender">'+esc(m.who.startsWith('member:')?m.who.slice(7):c.name)+'</div>':'')+esc(m.text)+'</div>'+(m.who==='me'?'<div class="avatar">我</div>':'')+'</div>').join('');$('content').scrollTop=$('content').scrollHeight}render();function footer(){$('footer').innerHTML='<form class="input-bar" id="sendform"><button type="button" class="round-tool" id="togglevoice">'+(voice?'⌨':'◉')+'</button>'+(voice?'<button type="button" class="voice-button" id="hold">按住 说话</button>':'<input id="msg" aria-label="消息" autocomplete="off">')+'<button type="button" class="round-tool" id="emoji">☺</button><button class="send" type="submit">发送</button></form>';$('togglevoice').onclick=()=>{voice=!voice;footer()};$('emoji').onclick=()=>{if($('msg'))$('msg').value+='😊'};$('sendform').onsubmit=e=>{e.preventDefault();let v=$('msg')?.value.trim();if(!v)return;c.messages.push({who:'me',text:v});save();render();$('msg').value=''}}footer()}const tick=()=>{const d=new Date(),t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('status-time').textContent=t;$('bigtime').textContent=t;$('date').textContent=d.toLocaleDateString('zh-CN',{month:'long let draft=[],editingIndex=0;
function openManager(){$('manager').classList.add('visible');renderManager()}
function renderManager(){const list=$('manage-list');list.innerHTML='';chats.forEach((c,i)=>{const row=document.createElement('div');row.className='manage-item';const label=document.createElement('div');label.style.flex='1';label.innerHTML='<b>'+esc(c.name)+'</b><div class="manage-member">'+(c.type==='group'?'群聊：'+esc((c.members||[]).join('、')):'联系人')+' · '+c.messages.length+' 条消息</div>';const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>openEditor(i);const rename=document.createElement('button');rename.textContent='改名';rename.onclick=()=>{const n=prompt('修改名称',c.name);if(n&&n.trim()){c.name=n.trim();save();renderManager()}};const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{if(confirm('删除 '+c.name+' 及其聊天记录？')){chats.splice(i,1);save();renderManager()}};row.append(label,edit,rename,del);list.append(row)})}
$('manage-add').onclick=()=>{const name=$('manage-name').value.trim(),type=$('manage-type').value,members=$('manage-members').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);if(!name)return alert('请输入名称');if(chats.some(c=>c.name===name))return alert('名称已存在');if(type==='group'&&!members.length)return alert('请填写群成员');chats.push({name,type,members,messages:[]});save();$('manage-name').value='';$('manage-members').value='';renderManager();openEditor(chats.length-1)};
$('manager-close').onclick=()=>{$('manager').classList.remove('visible');openApp('设置')};
function openEditor(i=0){editingIndex=i;const c=chats[i];draft=c.messages.map(m=>({...m}));$('editor-heading').textContent=c.name+' · 剧情编辑';$('editor-add-other').textContent=c.type==='group'?'＋ 群成员消息':'＋ '+c.name+'消息';$('editor').classList.add('visible');renderEditor()}
function saveDraft(){const c=chats[editingIndex];if(c){c.messages=draft.map(m=>({...m}));save()}}
function renderEditor(){const c=chats[editingIndex],list=$('editor-list');list.innerHTML='';if(c.type==='group'){const change=document.createElement('button');change.className='editor-launch';change.textContent='修改群成员：'+(c.members||[]).join('、');change.onclick=()=>{const v=prompt('用逗号分隔群成员',(c.members||[]).join('，'));if(v!==null){c.members=v.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);save();renderEditor()}};list.append(change)}draft.forEach((m,i)=>{const row=document.createElement('div');row.className='editor-row',side=document.createElement('select');const choices=c.type==='group'?[['me','我'],...(c.members||[]).map(x=>['member:'+x,x])]:[['other',c.name],['me','我']];if(!choices.some(x=>x[0]===m.who))choices.push([m.who,m.who]);choices.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;side.append(o)});side.value=m.who;side.onchange=()=>{m.who=side.value;saveDraft()};const ta=document.createElement('textarea');ta.value=m.text;ta.placeholder='输入消息';ta.oninput=()=>{m.text=ta.value;saveDraft()};const up=document.createElement('button');up.textContent='↑';up.onclick=()=>{if(i){[draft[i-1],draft[i]]=[draft[i],draft[i-1]];saveDraft();renderEditor()}};const down=document.createElement('button');down.textContent='↓';down.onclick=()=>{if(i<draft.length-1){[draft[i+1],draft[i]]=[draft[i],draft[i+1]];saveDraft();renderEditor()}};const del=document.createElement('button');del.textContent='×';del.onclick=()=>{draft.splice(i,1);saveDraft();renderEditor()};row.append(side,ta,up,down,del);list.append(row)})}
function addDraft(who){const c=chats[editingIndex];if(c.type==='group'&&who==='other')who='member:'+(c.members?.[0]||'群成员');draft.push({who,text:''});saveDraft();renderEditor();$('editor-list').lastElementChild?.querySelector('textarea')?.focus()}
$('editor-add-other').onclick=()=>addDraft('other');$('editor-add-me').onclick=()=>addDraft('me');$('editor-close').onclick=()=>{saveDraft();$('editor').classList.remove('visible');renderManager()};$('editor-preview').onclick=()=>{saveDraft();$('editor').classList.remove('visible');$('manager').classList.remove('visible');openApp('微信');showChat(editingIndex)};
function downloadStory(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('editor-export').onclick=()=>{saveDraft();const c=chats[editingIndex];downloadStory({version:2,contact:c.name,type:c.type||'single',members:c.members||[],messages:c.messages},c.name+'聊天剧情.json')};$('editor-import').onclick=()=>$('editor-file').click();$('editor-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.messages)||!data.messages.every(m=>typeof m.text==='string'&&typeof m.who==='string'))throw Error('格式不正确');draft=data.messages.map(m=>({who:m.who,text:m.text}));saveDraft();renderEditor();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
$('manager-export').onclick=()=>downloadStory({version:2,kind:'phone-simulator-story',chats},'捡手机全部剧情.json');$('manager-import').onclick=()=>$('manager-file').click();$('manager-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.kind!=='phone-simulator-story'||!Array.isArray(data.chats)||data.chats.length>100||!data.chats.every(c=>typeof c.name==='string'&&Array.isArray(c.messages)&&c.messages.every(m=>typeof m.text==='string'&&typeof m.who==='string')))throw Error('不是有效的全部剧情文件');if(!confirm('导入将替换本机所有聊天，确定吗？'))return;chats=data.chats;save();renderManager();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};</script></body></html>
