<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>捡手机模拟器</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.phone{width:min(390px,100vw);height:min(844px,100dvh);position:relative;overflow:hidden;background:linear-gradient(145deg,#425c92,#b87ca9 55%,#edb38f);border:7px solid #181818;border-radius:42px;box-shadow:0 20px 70px #0008}.status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 27px;font-weight:650;font-size:15px}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:105px;height:28px;border-radius:20px;background:#111}.clock{text-align:center;margin-top:70px;font-size:72px;font-weight:250;letter-spacing:-3px}.date{text-align:center;font-size:18px}.hint{text-align:center;margin-top:18px;font-size:13px;opacity:.8}.apps{position:absolute;left:20px;right:20px;bottom:108px;display:grid;grid-template-columns:repeat(4,1fr);gap:23px 10px}.app{text-align:center;font-size:12px;cursor:pointer}.app span{display:grid;place-items:center;width:57px;height:57px;margin:auto auto 7px;background:#ffffffd9;border-radius:15px;font-size:29px;color:#202838}.dock{position:absolute;bottom:20px;left:16px;right:16px;background:#ffffff45;border-radius:24px;padding:12px;display:flex;justify-content:space-around}.dock .app span{margin:0}.homebar{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:125px;height:5px;background:white;border-radius:9px}.screen{position:absolute;inset:0;background:#f6f6f9;color:#161616;display:none;padding-top:52px}.screen.active{display:block}.head{display:flex;align-items:center;gap:15px;padding:15px 20px;border-bottom:1px solid #ddd;font-weight:650;font-size:20px}.back{border:0;background:none;color:#1677ff;font-size:18px;cursor:pointer}.content{padding:18px;overflow:auto;height:calc(100% - 150px)}.thread{padding:15px;background:white;border-radius:15px;margin-bottom:10px;cursor:pointer}.thread small{display:block;color:#777;margin-top:6px}.bubble{background:#d9f7c5;padding:12px;border-radius:15px;margin:12px 0 12px auto;max-width:80%;width:max-content}.bubble.other{background:#fff;margin-left:0;margin-right:auto}.composer{position:absolute;bottom:22px;left:12px;right:12px;display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid #ddd;border-radius:20px;padding:12px}.composer button,.primary{border:0;border-radius:20px;background:#2ca76a;color:white;padding:10px 16px}.note{width:100%;height:60%;border:0;padding:15px;font:16px/1.7 inherit;resize:none;border-radius:12px}.settings{font-size:14px;color:#666;margin:12px 0}.screen .homebar{background:#333;cursor:pointer}
</style></head><body><main class="phone"><div class="island"></div><div class="status"><span id="time">9:41</span><span>●●● ▰</span></div><div class="date" id="date"></div><div class="clock" id="bigtime">9:41</div><div class="hint">点击图标探索这部手机</div><div class="apps" id="apps"></div><div class="dock" id="dock"></div><section class="screen" id="screen"><div class="head"><button class="back" onclick="home()">‹ 返回</button><span id="title"></span></div><div class="content" id="content"></div><div id="composer"></div><div class="homebar" onclick="home()"></div></section><div class="homebar"></div></main><script>
const definitions=[['微信','💬'],['备忘录','📝'],['相册','🌄'],['设置','⚙️'],['短信','✉️'],['电话','📞'],['日历','📅'],['关于','📱']];const dock=['微信','短信','电话','备忘录'];let activeChat='';const initialChats=[{name:'神秘联系人',messages:[{who:'other',text:'你终于找到这部手机了。'},{who:'other',text:'想知道它的主人是谁吗？先看看备忘录。'}]},{name:'小雨',messages:[{who:'other',text:'明天还在老地方见吗？'}]}];let chats=JSON.parse(localStorage.getItem('phone-chats')||'null')||initialChats;let note=localStorage.getItem('phone-note')||'10月23日\n\n如果有人捡到了我的手机，请帮我找到它的主人。\n\n线索一：有人在等一条消息。';const $=id=>document.getElementById(id);function save(){localStorage.setItem('phone-chats',JSON.stringify(chats))}function icon(item){const d=definitions.find(x=>x[0]===item);return '<div class="app" data-app="'+item+'"><span>'+d[1]+'</span>'+item+'</div>'}$('apps').innerHTML=definitions.map(x=>icon(x[0])).join('');$('dock').innerHTML=dock.map(icon).join('');document.querySelectorAll('[data-app]').forEach(e=>e.onclick=()=>openApp(e.dataset.app));function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){$('screen').classList.remove('active');$('composer').innerHTML='';activeChat=''}function openApp(name){$('screen').classList.add('active');$('title').textContent=name;$('composer').innerHTML='';const c=$('content');if(name==='微信'||name==='短信'){c.innerHTML=chats.map((x,i)=>'<div class="thread" data-chat="'+i+'">💬　'+esc(x.name)+'<small>'+esc(x.messages.at(-1)?.text||'')+'</small></div>').join('');c.querySelectorAll('[data-chat]').forEach(e=>e.onclick=()=>showChat(+e.dataset.chat))}else if(name==='备忘录'){c.innerHTML='<textarea class="note" id="note" aria-label="备忘录"></textarea><p class="settings">内容自动保存在本机浏览器</p>';$('note').value=note;$('note').oninput=e=>{note=e.target.value;localStorage.setItem('phone-note',note)}}else if(name==='设置'){c.innerHTML='<h3>模拟手机设置</h3><p>这是一个网页互动故事原型。</p><button class="primary" id="reset">重置故事数据</button>';$('reset').onclick=()=>{if(confirm('确定重置聊天和备忘录吗？')){localStorage.clear();location.reload()}}}else if(name==='关于'){c.innerHTML='<h3>捡手机 · 互动故事</h3><p>你偶然捡到一部手机。翻看消息与备忘录，慢慢拼凑主人的故事。</p><p>后续可添加人物、聊天分支、朋友圈、照片、密码锁和多结局。</p>'}else if(name==='电话'){c.innerHTML='<h3>最近通话</h3><div class="thread">未知号码　　昨天 21:08</div>'}else if(name==='相册'){c.innerHTML='<h3>相簿</h3><p>这里还没有照片。</p>'}else if(name==='日历'){c.innerHTML='<h3>日历</h3><p>重要约定：明天 · 老地方</p>'}}function showChat(i){activeChat=i;const chat=chats[i];$('title').textContent=chat.name;function render(){$('content').innerHTML=chat.messages.map(m=>'<div class="bubble '+(m.who==='other'?'other':'')+'">'+esc(m.text)+'</div>').join('');$('content').scrollTop=$('content').scrollHeight}render();$('composer').innerHTML='<form class="composer" id="form"><input id="msg" placeholder="输入消息…" autocomplete="off" aria-label="消息"><button>发送</button></form>';$('form').onsubmit=e=>{e.preventDefault();const v=$('msg').value.trim();if(!v)return;chat.messages.push({who:'me',text:v});save();$('msg').value='';render()}}function tick(){const d=new Date();const t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('time').textContent=t;$('bigtime').textContent=t;$('date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,30000);
</script></body></html>
